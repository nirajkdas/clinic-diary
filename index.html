<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gupta Dental Care</title>
<meta name="theme-color" content="#0b5d55">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gupta Dental">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday work tool for a solo dentist: calm, quick, two taps between patients
   IDEA her paper appointment register: ruled lines, times hanging in a red margin
   PICTURE today's register itself, slot by slot, filled and empty
   COLOUR white page, deep clinic teal band, coral margin + urgent, WhatsApp green for send
   TYPE Mukta 800 display + Mukta text (made for Devanagari)
   LAYOUT top band (date, three counts), view below, bottom tab bar; one column up to 760px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1514);--ink:light-dark(#13201e,#e6eeec);--mut:light-dark(#566663,#9aaca8);--line:light-dark(#e1e8e6,#24312f);--band:light-dark(#0b5d55,#0b3a36);--soft:light-dark(#eaf4f1,#152926);--brand:light-dark(#0b5d55,#5cc2b2);--onbrand:light-dark(#ffffff,#0e1514);--hot:light-dark(#c9341f,#ff7c68);--hotsoft:light-dark(#fdece9,#3a1d19);--wa:light-dark(#0d7a41,#2fbf72);--card:light-dark(#ffffff,#141d1c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Mukta,"Noto Sans Devanagari",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto}
header{background:var(--band);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
header .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:30px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{opacity:.85;font-size:15px}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.cnt{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;color:#fff;text-align:left;font:inherit;cursor:pointer}
.cnt b{display:block;font-size:30px;line-height:1;font-weight:800}
.cnt span{font-size:14px;opacity:.9}
.cnt.hot{background:#ff6a55;border-color:#ff6a55}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h2{font-size:22px;line-height:1.15;margin:22px 0 8px;font-weight:700}
h2:first-child{margin-top:4px}
.mut{color:var(--mut);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px/1.2 inherit;font-family:inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
.b:focus-visible,.cnt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ff8a75;outline-offset:2px}
.b:active{transform:translateY(1px)}
.b.pri{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.b.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.b.hot{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 40%,var(--line))}
.b.sm{min-height:38px;padding:6px 11px;font-size:15px}
.b.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.b[disabled]{opacity:.45;pointer-events:none}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.datebar strong{font-size:20px;text-align:center}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hotsoft);color:var(--hot);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600;cursor:pointer;border:0;width:100%;font-family:inherit;font-size:16px;text-align:left}
.demo{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:12px}
.reg{border-top:1px solid var(--line)}
.slot{display:grid;grid-template-columns:76px minmax(0,1fr);border-bottom:1px solid var(--line);min-height:58px}
.slot .t{border-right:2px solid color-mix(in srgb,var(--hot) 55%,transparent);padding:10px 10px 8px 0;text-align:right;line-height:1.05}
.slot .t b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.slot .t i{font-style:normal;font-size:13px;color:var(--mut)}
.slot .c{padding:8px 0 10px 12px}
.slot.past .t b{color:var(--mut)}
.slot.brk .c{color:var(--mut);display:flex;align-items:center;font-size:15px}
.slot .free{display:flex;align-items:center;justify-content:space-between;height:100%;color:var(--mut);gap:8px}
.nm{font-weight:700;font-size:19px;line-height:1.2}
.tr{font-size:15px;color:var(--mut)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--brand);margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag.hot{background:var(--hotsoft);color:var(--hot)}
.tag.done{background:transparent;color:var(--mut);border:1px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.card.done{opacity:.55}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px;color:var(--mut)}
.big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.prog i{display:block;height:100%;background:var(--wa)}
label{display:block;font-size:15px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:16px/1.4 inherit;font-family:inherit;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--mut) 45%,var(--line));background:var(--card);color:var(--ink);min-height:46px}
textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.addl{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--mut);font-size:15px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:8px;margin-bottom:8px;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav button{background:none;border:0;color:var(--mut);font:600 15px inherit;font-family:inherit;min-height:58px;cursor:pointer;position:relative}
nav button.on{color:var(--brand)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
nav sup{background:var(--hot);color:#fff;border-radius:99px;font-size:12px;padding:0 6px;margin-left:2px;line-height:18px;display:inline-block}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.pane{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pane h3{margin:0 0 4px;font-size:24px;line-height:1.1}
.foot{display:flex;gap:8px;margin-top:18px}
.foot .b{flex:1}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90%}
#toast.on{opacity:1}
.hist{font-size:15px;border-left:2px solid var(--line);padding-left:10px;margin:6px 0}

.gear{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;min-height:52px;padding:0 22px;border-radius:26px;border:0;background:var(--brand);color:var(--onbrand);font:700 17px/1 Mukta,system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.card.next{border:2px solid var(--brand);background:var(--soft)}
.card.next .acts .b{flex:1 1 auto}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .b{flex:1 1 140px}
.pick.times .chip{min-width:96px}
.slot.freeband .c{padding-block:8px}
.hist-box{margin-top:18px}
.hist-box summary{cursor:pointer;list-style:none}
.hist-box summary::-webkit-details-marker{display:none}
.hist-box summary h2::after{content:" ▾";color:var(--mut);font-size:16px}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:420px){.addl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.addl .b{grid-column:1/-1}h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div><h1 id="clinicName">Gupta Dental Care &amp; Hospital</h1><span class="sub" id="today"></span></div><button class="gear" data-a="tab" data-id="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  <div class="counts" id="counts"></div>
</div></header>
<main class="wrap" id="view"></main>
<nav><div class="wrap" id="tabs"></div></nav>
<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
