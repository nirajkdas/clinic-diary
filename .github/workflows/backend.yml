name: Deploy backend

# Runs whenever backend code changes, or by hand from the Actions tab.
# Needs: secret SUPABASE_ACCESS_TOKEN, and SUPABASE_PROJECT_REF as a variable or a secret.
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: backend-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      SITE: https://nirajkdas.github.io/clinic-diary/
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase is connected
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::Supabase is not connected yet (add SUPABASE_ACCESS_TOKEN secret and SUPABASE_PROJECT_REF variable). Skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Database tables and security rules
        if: env.SKIP != '1'
        run: |
          for f in supabase/migrations/*.sql; do
            sed "s#__PROJECT_URL__#https://$REF.supabase.co#g" "$f" > /tmp/m.sql
            jq -n --rawfile q /tmp/m.sql '{query:$q}' > /tmp/body.json
            curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/body.json > /tmp/out.json \
              || { cat /tmp/out.json; exit 1; }
            echo "applied $f"
          done

      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: latest

      - name: Server functions
        if: env.SKIP != '1'
        run: |
          supabase functions deploy call-webhook --project-ref "$REF" --no-verify-jwt --yes
          supabase functions deploy push-key --project-ref "$REF" --no-verify-jwt --yes
          supabase functions deploy daily-digest --project-ref "$REF" --no-verify-jwt --yes
          supabase functions deploy poll-calls --project-ref "$REF" --no-verify-jwt --yes

      - name: Point the app at this project
        if: env.SKIP != '1'
        run: |
          curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/keys.json
          ANON=$(jq -r '[.[] | select(.name=="anon")][0].api_key // empty' /tmp/keys.json)
          [ -n "$ANON" ] || { echo "no anon key found"; exit 1; }
          cat > config.js <<EOF
          // Written by the "Deploy backend" workflow. Both values are public (safe to commit).
          window.CLINIC_CFG = {
            url: "https://$REF.supabase.co",
            anon: "$ANON"
          };
          EOF
          if ! git diff --quiet config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Connect app to Supabase project" config.js
            git push
          fi
