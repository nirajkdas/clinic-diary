# Call providers cannot send a Supabase login token, and the app fetches the push key before sign-in,
# so these two functions check their own access (webhook token / public data only).
[functions.call-webhook]
verify_jwt = false

[functions.push-key]
verify_jwt = false

# Called by pg_cron with its own token (checked in the function).
[functions.daily-digest]
verify_jwt = false

# Called by pg_cron every minute with its own token (checked in the function).
[functions.poll-calls]
verify_jwt = false

# Inbound WhatsApp messages from AiSensy; checks the clinic token in the URL.
[functions.wa-webhook]
verify_jwt = false
